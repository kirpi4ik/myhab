plugins {
    id "com.bmuschko.docker-remote-api" version "10.0.0"
}

//tag::import[]
import com.bmuschko.gradle.docker.tasks.image.*

//end::import[]

group "${projectGroup}"

allprojects {
    apply plugin: 'idea'

    repositories {
        mavenLocal()
        maven { url = uri("https://repo.grails.org/grails/core") }
        maven { url = uri("https://plugins.gradle.org/m2/") }
    }
}
//tag::extVariables[]
ext {
    isGrailsPlugin = name.startsWith('grails-plugin')
    isBuildSnapshot = projectVersion.toString().endsWith("-SNAPSHOT")
    commonBuild = new File(project.rootDir, "gradle").absolutePath
    dockerBuildDir = layout.buildDirectory.dir('docker')
    dockerBuildGroup = 'Docker'
    dockerRegistry = 'index.docker.io'
    dockerRepo = 'myhab'
    tagId = "${projectVersion}"
    dockerTag = "${dockerRepo}:${tagId}" // <1>
}

//end::extVariables[]
//tag::prepareDocker[]
docker {
    registryCredentials {
        url = 'https://index.docker.io/v1/'
        def secret = file("${System.properties['user.home']}/.docker/hub.docker.com")
        if (secret.exists()) {
            username = secret.readLines().get(0)
            password = secret.readLines().get(1)
        }
    }
}
//tag::prepareDocker[]

subprojects { project ->
    version projectVersion
    group "${projectGroup}"

    ext {
        isGrailsApp = name.contains(project.name)
        isGrailsPlugin = name.startsWith('grails-plugin')
        isGrailsProject = isGrailsApp || isGrailsPlugin
        isBuildSnapshot = version.toString().endsWith("-SNAPSHOT")

    }
    
    // Configure Java toolchain to use Java 17 for all Java/Groovy projects
    afterEvaluate {
        // Apply to all projects that use Java/Groovy
        if (plugins.hasPlugin('java') || plugins.hasPlugin('groovy') || plugins.hasPlugin('java-library') || plugins.hasPlugin('org.grails.grails-web')) {
            // Use Java toolchain (requires Java 17 to be available)
            java {
                toolchain {
                    languageVersion = JavaLanguageVersion.of(17)
                }
            }
        }
    }
}

tasks.register('syncVersionToPackageJson') {
    description = 'Sync version from gradle.properties to package.json'
    group = 'versioning'

    doLast {
        def packageJsonFile = new File("${projectDir}/client/web-vue3/package.json")
        if (packageJsonFile.exists()) {
            def packageJson = new groovy.json.JsonSlurper().parseText(packageJsonFile.text)
            packageJson.version = "${projectVersion}"
            packageJsonFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(packageJson))
            logger.quiet "Updated package.json version to ${projectVersion}"
        }
    }
}

tasks.register('syncVersionToEnvFiles') {
    description = 'Sync version from gradle.properties to .env and .env.prod'
    group = 'versioning'

    doLast {
        // Update .env file
        def envFile = new File("${projectDir}/client/web-vue3/.env")
        if (envFile.exists()) {
            def envContent = envFile.text
            envContent = envContent.replaceAll(/PRJ_VERSION=.*/, "PRJ_VERSION=${projectVersion}")
            envFile.text = envContent
            logger.quiet "Updated .env version to ${projectVersion}"
        }
        
        // Update .env.prod file
        def envProdFile = new File("${projectDir}/client/web-vue3/.env.prod")
        if (envProdFile.exists()) {
            def envProdContent = envProdFile.text
            envProdContent = envProdContent.replaceAll(/PRJ_VERSION=.*/, "PRJ_VERSION=${projectVersion}")
            envProdFile.text = envProdContent
            logger.quiet "Updated .env.prod version to ${projectVersion}"
        }
    }
}

tasks.register('syncVersions') {
    description = 'Sync version from gradle.properties to all project files'
    group = 'versioning'
    dependsOn 'syncVersionToPackageJson', 'syncVersionToEnvFiles'

    doLast {
        logger.quiet "✅ All versions synchronized to ${projectVersion}"
    }
}

tasks.register('bumpVersion') {
    description = 'Increment the patch component of projectVersion in gradle.properties'
    group = 'versioning'

    doLast {
        def parts = projectVersion.toString().tokenize('.')
        def next = "${parts[0]}.${parts[1]}.${(parts[2] as int) + 1}"
        def propsFile = new File("${rootDir}/gradle.properties")
        propsFile.text = propsFile.text.replaceFirst(/(?m)^projectVersion=.*$/, "projectVersion=${next}")
        logger.quiet "Bumped projectVersion ${projectVersion} → ${next}"
    }
}

tasks.register('versionTxt') {
    dependsOn 'syncVersions'
    doLast {
        // Create docker directory if it doesn't exist
        def dockerDir = new File("${projectDir}/src/main/docker")
        if (!dockerDir.exists()) {
            dockerDir.mkdirs()
            logger.quiet "Created directory: ${dockerDir.absolutePath}"
        }
        
        // Generate version.txt
        new File(dockerDir, "version.txt").text = "${projectVersion}"
        
        // Generate app-entrypoint.sh
        def entrypointFile = new File(dockerDir, "app-entrypoint.sh")
        entrypointFile.text = """#!/bin/sh
set -e
# Force JVM timezone to UTC for consistent timestamp handling
java -jar -Dgrails.env=\$GRAILS_ENV -Duser.timezone=UTC /app/myhab.jar \$@
"""
        // Make the script executable (Unix-like systems)
        entrypointFile.setExecutable(true)
    }
}
// Public demo tasks (demoRun / demoSim / demoSeedLocal). Kept in demo/ so the
// demo's assets stay together and the root build file stays about the product.
apply from: "${rootDir}/demo/demo.gradle"

tasks.register('serve') {
    group = 'application'
    description = 'Run the Quasar development server for the web client (SPA mode)'
    dependsOn ':web-vue3:serve'
}

tasks.register('servePWA') {
    group = 'application'
    description = 'Run the Quasar development server for the web client (PWA mode)'
    dependsOn ':web-vue3:pwaDev'
}

//tag::buildClientPWA[]
/**
 * Build and bundle client resources for production
 * - Uses PWA mode for installable app with offline support
 * - Generates service worker for caching
 * - Creates manifest.json for app metadata
 * - Output: dist/pwa/ directory
 */
// Destination for the bundled client assets, and the client's own output dirs.
def serverPublicDir = project(':server-core').layout.buildDirectory.dir('resources/main/public')
def serverLibsDir = project(':server-core').layout.buildDirectory.dir('libs')
def clientBuildDir = project(':web-vue3').layout.buildDirectory
def clientDistPwaDir = "${project(':web-vue3').projectDir}/dist/pwa"

def copyClientResources = tasks.register('copyClientResources') { // <1> pwaBuild for PWA support
    group = 'build'
    description = 'Copy PWA client resources into server for production'
    // processResources populates build/resources/main; the client assets must be
    // staged after it so they are not wiped, and before the jar is packaged.
    dependsOn ':web-vue3:pwaBuild', ':server-core:processResources'

    doFirst { // <4>
        // PWA build output (Service Worker, manifest.json and all assets)
        copy {
            from clientDistPwaDir
            into serverPublicDir
        }
        logger.quiet "✅ Copied PWA client resources from dist/pwa to server public directory"
    }
    doLast {
        copy {
            from clientBuildDir
            into serverPublicDir
        }
    }
}

// Without this the jar can be packaged before the assets are staged, producing a
// JAR with an empty BOOT-INF/classes/public.
project(':server-core').tasks.matching { it.name in ['bootJar', 'jar'] }.configureEach {
    mustRunAfter copyClientResources
}
//end::buildClientPWA[]

tasks.register('assembleServerAndClient') { // <2>
    group = 'build'
    description = 'Build combined server & web-vue3 JAR/WAR'
    dependsOn 'copyClientResources', 'versionTxt', ':server-core:assemble'

    doLast {
        copy {
            from serverLibsDir // <3>
            into layout.buildDirectory
        }

        logger.quiet "JAR/WAR generated at $rootDir/build/. It combines the server and web-vue3 projects."
    }
}

tasks.register('prepareDocker', Copy) { // <3>
    description = 'Copy files from src/main/docker and application jar to Docker temporal build directory'
    group = dockerBuildGroup
    dependsOn 'assembleServerAndClient'
    into dockerBuildDir
    into(".") {
        from 'src/main/docker'
        from layout.buildDirectory.file("${projectName}-${projectVersion}.jar")
    }

    eachFile { logger.quiet("## ${it.file.absolutePath} | ${it.file.length()}") }
}
//end::prepareDocker[]

//tag::createDockerfile[]
tasks.register('createDockerfile', Dockerfile) { // <4>
    description = 'Create a Dockerfile file'
    group = dockerBuildGroup
    dependsOn 'prepareDocker'

    destFile = dockerBuildDir.map { it.file('Dockerfile') }

    from 'eclipse-temurin:17-jre'

    // Values must be plain Strings — the Dockerfile task rejects GStrings.
    label(['project': 'myHAB'])
    label(['version': "${projectVersion}".toString()])
    label(['org.opencontainers.image.authors': 'Dumitru Ciubenco "dumitru.ciubenco@gmail.com"'])

    exposePort 8181
    environmentVariable 'GRAILS_ENV', 'production'
    // Create a config directory and expose as volume.
    // External configuration files in this volume are automatically
    // picked up.
    runCommand 'mkdir -p /app/config'
    volume '/app/config'
    workingDir '/app'

    copyFile "${projectName}-${projectVersion}.jar".toString(), "${projectName}.jar".toString()
    copyFile 'app-entrypoint.sh', 'app-entrypoint.sh' // <5>
    runCommand 'chmod +x app-entrypoint.sh'

    entryPoint '/app/app-entrypoint.sh' // <5>
}
//end::createDockerfile[]

//tag::buildImage[]
def buildImage = tasks.register('buildImage', DockerBuildImage) { // <6>
    description = 'Create Docker image to run the Grails application'
    group = dockerBuildGroup
    dependsOn 'createDockerfile'

    inputDir = dockerBuildDir
    images.add("${githubSlug}:${tagId}")
}

tasks.register('tagImage', DockerTagImage) {
    description = "Tag custom docker image."
    group = dockerBuildGroup
    dependsOn buildImage
    targetImageId buildImage.flatMap { it.imageId }
    repository = "${githubSlug}".toString()
    tag = "${tagId}"
}

tasks.register('pushImage', DockerPushImage) {
    group = dockerBuildGroup
    description = "Push custom docker image."
    dependsOn 'tagImage'

    images.add("${githubSlug}:${tagId}".toString())
}
//end::buildImage[]
tasks.register('removeImage', DockerRemoveImage) {
    description = 'Remove Docker image with Grails application.'
    group = dockerBuildGroup
    targetImageId { dockerTag }
}

/**
 * BUILD WORKFLOW SUMMARY
 * ======================
 * 
 * Development:
 * ------------
 * gradle serve          - Run SPA dev server (standard mode)
 * gradle servePWA       - Run PWA dev server (with Service Worker)
 * gradle bootRun        - Run Grails backend server
 * 
 * Production Build:
 * -----------------
 * 1. gradle assembleServerAndClient
 *    ├── syncVersions (sync version across all files)
 *    ├── :web-vue3:pwaBuild (build PWA with Service Worker)
 *    ├── copyClientResources (copy dist/pwa to server public/)
 *    └── :server-core:assemble (build JAR with embedded PWA)
 * 
 * 2. gradle buildImage
 *    ├── prepareDocker (prepare Docker context)
 *    ├── createDockerfile (generate Dockerfile)
 *    └── buildImage (build Docker image)
 * 
 * 3. gradle pushImage (push to Docker registry)
 * 
 * PWA Features in Production:
 * ---------------------------
 * ✓ Installable app (Chrome/Edge/Safari)
 * ✓ Offline support via Service Worker
 * ✓ Auto-updates with user notification
 * ✓ App manifest for metadata
 * ✓ Optimized caching strategies
 * ✓ Push notification ready
 * 
 * Docker Image Contents:
 * ----------------------
 * - Java 17 JRE
 * - Grails backend application
 * - Vue 3 PWA frontend (in /public)
 * - Service Worker (sw.js)
 * - PWA Manifest (manifest.json)
 * - App icons and assets
 */

//apply from: "${commonBuild}/common-publishing.gradle"
