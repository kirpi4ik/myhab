# Configuration seed for the public demo.
#
# This is imported into a standalone bare git repo (see demo/README.md) which the
# demo's ConfigProvider clones over file://. It is deliberately a repo of its own
# rather than a branch of any real deployment's config: the demo publishes an admin
# account, and the `appConfig` GraphQL query returns every key here to any
# admin-authenticated caller. Nothing secret may be added to this file.
#
# Keys that are intentionally absent, because the demo has no outbound network and
# each degrades cleanly when missing:
#   telegram.*      - suppressed by myhab.telegram.enabled=false
#   opsgenie.*      - AlertService only reads them when an alert is raised
#   push.vapid.*    - WebPushService logs one warning and stays inactive

profile: demo

mqtt:
  # Resolves to the demo-mqtt container, or to the simulator's embedded broker
  # on localhost when running via ./gradlew demoRun.
  hostname: demo-mqtt
  port: 1883
  username: demo
  password: demo
  # Everything publishes under the myhab prefix — the simulated Tuya valve too,
  # in its myhab/tuya/ sub-namespace (the TUYA dialect's shape).
  topics: myhab/#

cors:
  allowedOrigin:
    # WebSocket (STOMP) origins. The demo is served over HTTPS by the production
    # proxy, and the app does not trust X-Forwarded-Proto, so the https origin must be
    # listed explicitly. http:// stays while the proxy still rewrites same-site origins
    # to it (a bridge for images up to 2.8.17). demo.myhab.app: add once it has DNS.
    - https://demo.myhab.org
    - http://demo.myhab.org
    - http://localhost:10002

heat:
  thermostat:
    enabled: false
  temp:
    allDay: 21

admin:
  devices:
    autoimport: false
  ports:
    autoimport: false

# ---------------------------------------------------------------------------
# UI-facing config. Only keys under the prefixes allowlisted by `uiConfigList`
# (specialDevices.*, specialZones.*, ui.*, grafana.*, surveillance.*) reach the
# browser, and none of them are secret.
# ---------------------------------------------------------------------------

# The dashboard's quick-access tiles route to these zones. Ids come from
# demo/seed/demo-entities.sql.
specialZones:
  int:
    id: 1001      # Living Room
  ext:
    id: 1003      # Terrace
  parter:
    id: 1001      # Living Room
  etaj:
    id: 1007      # Upper Floor
  # The sprinkler dashboard card links to these two.
  lan:
    id: 1005      # Lawn
  garden:
    id: 1006      # Garden

# specialDevices tiles the demo configures: the valve and the intercom. The other
# tiles keyed off this prefix (door lock, water pump) have no seeded peripheral,
# so they stay in their "not configured" state on purpose.
specialDevices:
  waterValve:
    peripheral:
      id: 5022      # Garden Water Valve
  intercom:
    peripheral:
      id: 5023      # Gate Intercom

# Server-side intercom settings (NOT UI-safe-prefixed, so never sent to the
# browser). unlockPin is compared against the PIN the widget submits; the demo
# has no reachable device, so unlock never actually fires.
intercom:
  intercom:         # keyed by device code ('intercom')
    unlockPin: "1234"

ui:
  meteo:
    # Never publish a real address. The demo house is deliberately fictional.
    locationName: Demo Town
