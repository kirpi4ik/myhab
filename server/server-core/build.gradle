plugins {
    id "java"
    id "org.apache.grails.gradle.grails-web"
    id "org.apache.grails.gradle.grails-gsp"
    id "org.apache.grails.gradle.grails-gson"
    id 'codenarc'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = uri("https://repo.grails.org/grails/core") }
}

configurations {
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
}

dependencies {
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
//    developmentOnly("org.springframework.boot:spring-boot-devtools")
    console "org.apache.grails:grails-console"
    implementation project(':server-rules')
    implementation project(':server-config')

    implementation 'io.micrometer:micrometer-registry-prometheus:1.11.4'

    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
//    implementation "org.springframework.boot:spring-boot-starter-cache"
    implementation "org.apache.grails:grails-core"
    implementation "org.apache.grails:grails-url-mappings"
    implementation "org.apache.grails:grails-controllers"
    implementation "org.apache.grails:grails-converters"
    implementation "org.apache.grails:grails-rest-transforms"
    implementation "org.apache.grails:grails-codecs"
    implementation "org.apache.grails:grails-interceptors"
    implementation "org.apache.grails:grails-services"
    implementation "org.apache.grails:grails-datasource"
    implementation "org.apache.grails:grails-databinding"
    implementation "org.apache.grails:grails-web-boot"
    implementation "org.apache.grails:grails-logging"
    implementation "org.apache.grails:grails-cache"
    implementation "org.apache.grails:grails-async"

    implementation "org.apache.grails:grails-spring-security"
    implementation "org.apache.grails:grails-spring-security-rest"

    implementation "org.apache.grails:grails-views-gson"
    implementation "org.apache.grails:grails-events"
    implementation "org.apache.grails:grails-gsp"
    implementation "org.apache.grails:grails-data-hibernate5"
    implementation "org.apache.grails:grails-data-graphql"
    // Using native Quartz scheduler (no Grails plugin)
    implementation 'org.quartz-scheduler:quartz:2.5.2'
    // C3P0 connection pooling for Quartz's own dataSource
    implementation 'com.mchange:c3p0:0.9.5.5'
    //cache
    implementation 'com.hazelcast:hazelcast:5.7.0'
    implementation 'com.hazelcast:hazelcast-spring:5.7.0'
    implementation 'org.postgresql:postgresql:42.7.7'
    implementation 'org.jsoup:jsoup:1.15.3'
    // QR code generation for printable labels (LabelService)
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'
    implementation 'com.konghq:unirest-java:3.13.8'
    //Telegram bot api
    implementation 'org.telegram:telegrambots-springboot-longpolling-starter:10.1.1'
    implementation 'org.telegram:telegrambots-client:10.1.1'
    //Web Push (VAPID) for browser/PWA system notifications
    implementation 'nl.martijndwars:web-push:5.1.2'
    // WebPushService registers BouncyCastleProvider directly; jdk18on is the
    // maintained artifact (web-push still pulls the EOL jdk15on).
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    // ONVIF cameras arrive over MQTT via the onvif2mqtt bridge (see MQTTTopic.ONVIF),
    // so no ONVIF client library is needed here.
    //opsgenie atlassian — used by org.myhab.alert.AlertService
    implementation "com.opsgenie.integration:sdk:2.13.7"
    // Logback versions come from the Spring Boot BOM. Config is XML
    // (grails-app/conf/logback-spring.xml); logback >= 1.3 dropped Groovy config.
    implementation 'net.logstash.logback:logstash-logback-encoder:8.1'

    implementation 'io.github.zyro23:grails-spring-websocket:2.7.1'
    implementation "org.springframework.integration:spring-integration-mqtt"
    implementation 'org.springframework.integration:spring-integration-jmx'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    implementation "org.springframework.security:spring-security-config"
    implementation "org.springframework.security:spring-security-messaging"
    implementation "org.springframework.security:spring-security-web"

    // Tomcat JDBC pool is kept deliberately: application.groovy configures ~20
    // Tomcat-specific pool properties that have no HikariCP equivalent.
    runtimeOnly "org.apache.tomcat:tomcat-jdbc"
    runtimeOnly 'jakarta.xml.bind:jakarta.xml.bind-api'

    // Groovy 4 needs a different artifactId, so toolVersion alone cannot select it.
    codenarc "org.codenarc:CodeNarc-Groovy4:$codenarcVersion"

    testImplementation "org.apache.grails:grails-testing-support-datamapping"
    testImplementation "org.mockito:mockito-core"
    testImplementation "org.apache.grails:grails-testing-support-web"
    testImplementation "org.apache.grails:grails-testing-support-views-gson"
    testImplementation 'org.hibernate.validator:hibernate-validator'
}

// Explicitly specify the main class for Spring Boot
springBoot {
    mainClass = 'org.myhab.init.Application'
}

bootRun {
    jvmArgs(
            '-Dspring.output.ansi.enabled=always',
            '-XX:TieredStopAtLevel=1',
            '-Xmx1024m'
            /*,'-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005'*/)
    String springProfilesActive = 'spring.profiles.active'
    systemProperty springProfilesActive, System.getProperty(springProfilesActive)
}

bootJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    rootSpec.filesMatching('**/*.jar', { jar ->
        String groupId = jar.file.parentFile.parentFile.parentFile.parentFile.name
        jar.name = "$groupId-${jar.name}"
    })
    archiveFileName = "${projectName}-${project.version}.jar"
}

// Required for Spock 2.x — without it the Test task runs the JUnit 4 engine and
// silently discovers zero specs.
test {
    useJUnitPlatform()
}
