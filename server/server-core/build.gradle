//    main {
//        groovy {
//            srcDirs = ['grails-app/controllers',
//                       'grails-app/domain',
//                       'grails-app/init',
//                       'grails-app/jobs',
//                       'grails-app/services',
//                       'grails-app/utils']
//        }
//    }
//}
codenarc {
    toolVersion = codenarcVersion
    configFile = file("${projectDir}/config/codenarc/rules.groovy")
    maxPriority1Violations = 0
    maxPriority2Violations = 100
    maxPriority3Violations = 2500
}
codenarcMain {
    ignoreFailures = true  // Don't fail build on violations
}

codenarcTest {
    ignoreFailures = true
}