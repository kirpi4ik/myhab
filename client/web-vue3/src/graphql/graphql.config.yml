# IDE helper for the JS GraphQL plugin. Put a token here locally if you need one, but
# do not commit it: this file is public, and a real token carries an encoded principal.
schema: schema.graphql
extensions:
  endpoints:
    Default GraphQL Endpoint:
      url: http://localhost:8181/graphql
      headers:
        user-agent: JS GraphQL
        Origin: http://localhost:10002
        Authorization: Bearer ${GRAPHQL_TOKEN}
      introspect: true
